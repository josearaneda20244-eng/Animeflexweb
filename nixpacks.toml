[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = ["npm install -g pnpm@latest", "pnpm install --no-frozen-lockfile"]

[phases.build]
cmds = ["rm -rf artifacts/api-server/dist", "pnpm --filter @workspace/api-server run build"]

[start]
cmd = "node --enable-source-maps artifacts/api-server/dist/index.mjs"
