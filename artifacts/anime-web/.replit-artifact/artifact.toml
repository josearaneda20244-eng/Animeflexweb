kind = "web"
previewPath = "/anime-web/"
title = "AnimeFlex Web"
version = "1.0.0"
id = "artifacts/anime-web"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/anime-web/" ]
localPort = 24976

[services.development]
run = "pnpm --filter @workspace/anime-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/anime-web", "run", "build" ]
publicDir = "artifacts/anime-web/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24976"
BASE_PATH = "/anime-web/"
